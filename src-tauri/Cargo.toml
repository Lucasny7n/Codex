[package]
name = "codex_command_center"
default-run = "codex_command_center"
version = "0.1.0"
edition = "2021"
description = "Premium desktop command center for local and cloud AI models"
authors = ["Lucas"]
license = "MIT"
repository = "https://github.com/Lucasny7n/Codex"
homepage = "https://github.com/Lucasny7n/Codex"
readme = "../README.md"
keywords = ["tauri", "rust", "ai", "ollama", "desktop"]
categories = ["development-tools"]

[lib]
name = "codex_command_center_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[package.metadata.codex-command-center]
product-name = "Codex Command Center"
summary = "Premium desktop command center for local and cloud AI models."

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
anyhow = "1.0.100"
chrono = { version = "0.4.42", features = ["serde"] }
notify = "8.2.0"
parking_lot = "0.12.5"
regex = "1.12.2"
reqwest = { version = "0.13.3", features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tauri = { version = "2.9.2", features = [] }
tauri-plugin-shell = "2.3.5"
thiserror = "2.0.18"
tokio = { version = "1.48.0", features = ["rt-multi-thread", "macros", "process", "io-util", "fs", "sync", "time"] }
uuid = { version = "1.18.1", features = ["v4", "serde"] }

[features]
default = []
