[package]
name = "codex_command_center"
default-run = "codex_command_center"
version = "0.1.0"
edition = "2021"
description = "Central desktop para operar agentes tipo Codex"
authors = ["Lucas"]
license = "MIT"

[lib]
name = "codex_command_center_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
anyhow = "1.0.100"
chrono = { version = "0.4.42", features = ["serde"] }
notify = "8.2.0"
parking_lot = "0.12.5"
regex = "1.12.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tauri = { version = "2.9.2", features = [] }
thiserror = "2.0.18"
tokio = { version = "1.48.0", features = ["rt-multi-thread", "macros", "process", "io-util", "fs", "sync"] }
uuid = { version = "1.18.1", features = ["v4", "serde"] }

[features]
default = []
