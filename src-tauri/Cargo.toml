[package]
name = "ailu-ai-studio"
default-run = "ailu-ai-studio"
version = "0.1.0"
edition = "2021"
description = "Premium AI studio for local and cloud models"
authors = ["Lucas"]
license = "MIT"
repository = "https://github.com/Lucasny7n/ailu-ai-studio"
homepage = "https://github.com/Lucasny7n/ailu-ai-studio"
readme = "../README.md"
keywords = ["tauri", "rust", "ai", "ollama", "desktop"]
categories = ["development-tools"]

[lib]
name = "ailu_ai_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[package.metadata.ailu-ai-studio]
product-name = "Ailu AI Studio"
summary = "Premium AI studio for local and cloud models."

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
anyhow = "1.0.100"
chrono = { version = "0.4.42", features = ["serde"] }
dirs = "6.0.0"
notify = "8.2.0"
parking_lot = "0.12.5"
regex = "1.12.2"
reqwest = { version = "0.13.3", features = ["json"] }
rusqlite = "0.39.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sysinfo = "0.39.2"
tauri = { version = "2.9.2", features = [] }
tauri-plugin-shell = "2.3.5"
thiserror = "2.0.18"
tokio = { version = "1.48.0", features = ["rt-multi-thread", "macros", "process", "io-util", "fs", "sync", "time"] }
uuid = { version = "1.18.1", features = ["v4", "serde"] }

[features]
default = []
