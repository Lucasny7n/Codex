name: Feature request
description: Propose a focused improvement.
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the smallest useful version.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Chat
        - Temporary chat
        - Cloud providers
        - Ollama/local models
        - STT/microphone
        - Attachments/files
        - Settings/Health Check
        - Security
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Constraints
      description: Note security, compatibility, performance or UX constraints.
  - type: textarea
    id: validation
    attributes:
      label: Suggested validation
      description: How should maintainers prove this works?
