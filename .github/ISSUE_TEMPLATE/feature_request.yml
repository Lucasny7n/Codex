name: Feature request
description: Propose a focused improvement.
title: "feat: "
labels: ["type: feature", "status: needs-info"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the smallest useful version.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What else could solve this?
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - AI Workspace
        - LLM Library
        - Chat
        - Temporary chat
        - Cloud providers
        - Ollama/local models
        - STT/microphone
        - Attachments/files
        - Settings/Health Check
        - Desktop/Tauri
        - UI
        - Security
        - Documentation
        - CI/repository
        - Other
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - Low
        - Medium
        - High
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or mockups
      description: Add visual references if relevant. Do not copy third-party branding/assets.
  - type: textarea
    id: constraints
    attributes:
      label: Constraints
      description: Note security, compatibility, performance or UX constraints.
  - type: textarea
    id: validation
    attributes:
      label: Suggested validation
      description: How should maintainers prove this works?
  - type: textarea
    id: context
    attributes:
      label: Additional context
